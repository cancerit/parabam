name: Test Parabam Subset

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]
  workflow_dispatch:

jobs:
  test-subset:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y samtools

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel Cython>=3.0.0
        pip install numpy pysam>=0.10.0

    - name: Build and install parabam
      run: |
        pip install -e .

    - name: Verify installation
      run: |
        parabam --help

    - name: Run subset command
      run: |
        parabam subset --input test-data/test.bam --rule test-data/get_reads_with_flag_99.py

    - name: Verify output file exists
      run: |
        if [ ! -f test_subset.bam ]; then
          echo "Error: test_subset.bam was not created"
          exit 1
        fi
        echo "test_subset.bam created successfully"

    - name: Count reads in output
      run: |
        OUTPUT_READS=$(samtools view -c test_subset.bam)
        echo "Number of reads in test_subset.bam: $OUTPUT_READS"
        if [ "$OUTPUT_READS" -ne 89 ]; then
          echo "Error: Expected 89 reads, got $OUTPUT_READS"
          exit 1
        fi
        echo "Read count verification passed: 89 reads"

    - name: Count reads in input (for reference)
      run: |
        INPUT_READS=$(samtools view -c test-data/test.bam)
        echo "Number of reads in original test.bam: $INPUT_READS"
        echo "Reduced from $INPUT_READS to 89 reads"

    - name: Display test summary
      if: always()
      run: |
        echo "=== Test Summary ==="
        echo "Python version: ${{ matrix.python-version }}"
        echo "Status: ${{ job.status }}"
